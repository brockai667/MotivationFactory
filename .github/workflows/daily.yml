name: BrainHeist Publish

# Riddle videa stavia lokalny RiddleFactory builder (C:\Users\damia\RiddleFactory)
# a pushuje ich do output/ tohto repa. Tento workflow ich len PUBLIKUJE do Buffera
# (YT + IG + TikTok). Ziadna generacia obsahu v cloude.

on:
  schedule:
    - cron: "52 19 * * *"  # 20:52 SK vecer vopred (cron meska 4-6 h) -> video v TikTok appke do 10:00 SK; YT/IG slot ostava 15:xx SK
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests cloudinary pillow   # pillow = vyber cisteho framu na thumbnail

      - name: Prepare config
        run: cp config.example.json config.json

      - name: Push videos to Buffer
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python push_to_buffer.py 1   # 1 video/den (anti-kanibalizacia)

      - name: Retry failed Buffer posts (auto-heal)
        continue-on-error: true
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: python retry_failed.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f config.json
          git add pushed.json schedule_state.json 2>/dev/null || true
          git commit -m "state: publish run $(date -u +%F)" || echo "no changes"
          git push || echo "nothing to push"
